<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Jéssica & Thiago | Nosso Casamento</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" sizes="180x180" href="LOGO2.1.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        
    <!-- CARTA -->
    <section class="cover" id="cover">
        <div class="invite">
            <button onclick="abrirConvite()" aria-label="Abrir convite"></button>
        </div>
    </section>

    <!-- TOPO AQUARELA -->
    <section class="top-image">
        <img src="topbanner.png" alt="Ilustração em aquarela">
    </section>
    
    <!-- PRIMEIRA TELA REAL -->
    <section class="hero">
        <h1 class="reveal">Jéssica & Thiago</h1>
        <p class="reveal delay-1">
            Com o coração cheio de amor, convidamos você para celebrar esse momento conosco.
        </p>
        <span class="date reveal delay-2">
            28 • Novembro • 2026
        </span>

        <div class="countdown reveal delay-3">
            <div class="time-box">
                <span id="days">00</span>
                <small>Dias</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Horas</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Min</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seg</small>
            </div>
        </div>

        <div class="scroll-indicator reveal delay-3">
            ↓
        </div>
    </section>



    <script src="script.js"></script>
    </body>
</html>
